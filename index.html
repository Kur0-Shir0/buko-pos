<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buko Stall POS</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#16a34a">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 font-sans text-gray-900 select-none antialiased">

    <header class="bg-green-600 text-white shadow-md px-4 py-3 flex justify-between items-center sticky top-0 z-40">
        <h1 id="app-title" class="text-xl font-bold tracking-tight">🥥 Buko POS</h1>
        <div class="flex items-center gap-3 font-medium text-sm">
            <span id="sync-badge" class="bg-red-500 text-white px-2 py-0.5 rounded-full text-xs">Offline</span>
            <span id="shift-status-badge" class="bg-red-800 text-white px-2 py-0.5 rounded-full text-xs">Closed</span>
        </div>
    </header>

    <main id="view-canvas" class="container mx-auto px-4 pt-4 pb-28 min-h-screen"></main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-2xl flex justify-around items-center z-50 h-20">
        <button onclick="App.navigate('dashboard')" class="nav-btn flex flex-col items-center justify-center w-full text-gray-500 font-semibold text-xs gap-1 py-2 active:bg-gray-100" data-view="dashboard">📊 <span>Dash</span></button>
        <button onclick="App.navigate('sales')" class="nav-btn flex flex-col items-center justify-center w-full text-gray-500 font-semibold text-xs gap-1 py-2 active:bg-gray-100" data-view="sales">💰 <span>Sales</span></button>
        <button onclick="App.navigate('inventory')" class="nav-btn flex flex-col items-center justify-center w-full text-gray-500 font-semibold text-xs gap-1 py-2 active:bg-gray-100" data-view="inventory">📦 <span>Stock</span></button>
        <button onclick="App.navigate('expenses')" class="nav-btn flex flex-col items-center justify-center w-full text-gray-500 font-semibold text-xs gap-1 py-2 active:bg-gray-100" data-view="expenses">💸 <span>Exp</span></button>
        <button onclick="App.navigate('reports')" class="nav-btn flex flex-col items-center justify-center w-full text-gray-500 font-semibold text-xs gap-1 py-2 active:bg-gray-100" data-view="reports">📋 <span>Shift</span></button>
        <button onclick="App.navigate('settings')" class="nav-btn flex flex-col items-center justify-center w-full text-gray-500 font-semibold text-xs gap-1 py-2 active:bg-gray-100" data-view="settings">⚙️ <span>Set</span></button>
    </nav>

    <script src="js/db.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/products.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/sales.js"></script>
    <script src="js/expenses.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/importExcel.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.error(err));
            });
        }
    </script>
</body>
</html>
